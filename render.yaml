# $0 deployment: one Free web service, existing Supabase, no production worker.
# Check workspace billing/usage before applying; do not enable paid overages.
previews:
  generation: off

services:
  - type: web
    name: mini-task-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: SERVICE_API_KEY
        generateValue: true
